services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: memphis-backend-prod
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      MONGODB_URI: ${MONGODB_DOCKER_URI:-mongodb://mongo:27017/db}
      DB_NAME: ${DB_NAME:-db}
    networks:
      - memphis-network
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8.2
    container_name: memphis-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - memphis-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  memphis-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
